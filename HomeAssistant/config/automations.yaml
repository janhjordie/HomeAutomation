  description:
    "Logs SolarBalance energy and economics signals every minute using
    confirmed solarcust0186 entities. Focuses on house load, PV contribution, grid
    import / export, battery charge / discharge, and daily buy / sell totals.

    "
  triggers:
    - trigger: time_pattern
      minutes: /1
  actions:
    - action: shell_command.deye_log_line
      data:
        line: "{{ line }}"
  mode: queued
  max: 5
  variables:
    soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(0) }}"
    volt: "{{ states('sensor.solarcust0186_battery_voltage') | float(0) }}"
    load_w: "{{ states('sensor.solarcust0186_load_totalpower') | float(0) }}"
    pv_w: "{{ states('sensor.solarcust0186_total_solar_power') | float(0) }}"
    grid_w: "{{ states('sensor.solarcust0186_total_grid_power') | float(0) }}"
    batt_w: "{{ states('sensor.solarcust0186_battery_output_power') | float(0) }}"
    batt_mode:
      "{% if batt_w > 50 %}\n  discharge\n{% elif batt_w < -50 %}\n  charge\n{%
      else %}\n  idle\n{% endif %}"
    batt_discharge_w: "{{ batt_w if batt_w > 0 else 0 }}"
    batt_charge_w: "{{ (batt_w * -1) if batt_w < 0 else 0 }}"
    grid_import_w: "{{ grid_w if grid_w > 0 else 0 }}"
    grid_export_w: "{{ (grid_w * -1) if grid_w < 0 else 0 }}"
    pv_to_house_w: "{{ [pv_w, load_w] | min | round(0) }}"
    batt_to_house_w:
      "{{ [batt_discharge_w | float(0), [load_w - pv_to_house_w, 0]
      | max] | min | round(0) }}"
    grid_to_house_w:
      "{{ [load_w - pv_to_house_w - batt_to_house_w, 0] | max | round(0)
      }}"
    pv_spill_or_export_w:
      "{{ [pv_w - pv_to_house_w - batt_charge_w, 0] | max | round(0)
      }}"
    daily_consumption_kwh: "{{ states('sensor.solarcust0186_daily_consumption')
      | float(0) }}"
    daily_bought_kwh:
      "{{ states('sensor.solarcust0186_daily_energy_bought') | float(0)
      }}"
    daily_sold_kwh:
      "{{ states('sensor.solarcust0186_daily_energy_sold') | float(0)
      }}"
    daily_pv_kwh:
      "{{ states('sensor.solarcust0186_daily_pv_production') | float(0)
      }}"
    daily_batt_charge_kwh:
      "{{ states('sensor.solarcust0186_today_charge_of_the_battery')
      | float(0) }}"
    daily_batt_discharge_kwh:
      "{{ states('sensor.solarcust0186_today_discharge_of_the_battery')
      | float(0) }}"
    total_consumption_kwh: "{{ states('sensor.solarcust0186_total_consumption')
      | float(0) }}"
    total_bought_kwh:
      "{{ states('sensor.solarcust0186_total_energy_bought') | float(0)
      }}"
    total_sold_kwh:
      "{{ states('sensor.solarcust0186_total_energy_sold') | float(0)
      }}"
    total_pv_kwh:
      "{{ states('sensor.solarcust0186_total_pv_production') | float(0)
      }}"
    current_buy_price_kr: "{{ states('sensor.solarcust0186_text1') | replace('
      kr', '') | float(0) }}"
    solar_sell_enabled: "{{ states('switch.solarcust0186_solar_sell') }}"
    grid_charge_enabled: "{{ states('switch.solarcust0186_grid_charge') }}"
    energy_priority: "{{ states('select.solarcust0186_energy_priority') }}"
    low_batt_soc_limit:
      "{{ states('number.solarcust0186_soba_low_batt_soc_limit')
      | float(0) }}"
    high_batt_soc_limit:
      "{{ states('number.solarcust0186_soba_high_batt_soc_limit')
      | float(0) }}"
    line:
      "{{ now().isoformat() }}, tag=soba_energy, soc={{ soc | round(1) }}, volt={{
      volt | round(2) }}, load_w={{ load_w | round(0) }}, pv_w={{ pv_w | round(0)
      }}, batt_w={{ batt_w | round(0) }}, batt_mode={{ batt_mode }}, batt_charge_w={{
      batt_charge_w | round(0) }}, batt_discharge_w={{ batt_discharge_w | round(0)
      }}, grid_w={{ grid_w | round(0) }}, grid_import_w={{ grid_import_w | round(0)
      }}, grid_export_w={{ grid_export_w | round(0) }}, pv_to_house_w={{ pv_to_house_w
      }}, batt_to_house_w={{ batt_to_house_w }}, grid_to_house_w={{ grid_to_house_w
      }}, pv_spill_or_export_w={{ pv_spill_or_export_w }}, daily_consumption_kwh={{
      daily_consumption_kwh | round(3) }}, daily_bought_kwh={{ daily_bought_kwh |
      round(3) }}, daily_sold_kwh={{ daily_sold_kwh | round(3) }}, daily_pv_kwh={{
      daily_pv_kwh | round(3) }}, daily_batt_charge_kwh={{ daily_batt_charge_kwh |
      round(3) }}, daily_batt_discharge_kwh={{ daily_batt_discharge_kwh | round(3)
      }}, total_consumption_kwh={{ total_consumption_kwh | round(1) }}, total_bought_kwh={{
      total_bought_kwh | round(1) }}, total_sold_kwh={{ total_sold_kwh | round(1)
      }}, total_pv_kwh={{ total_pv_kwh | round(1) }}, buy_price_kr={{ current_buy_price_kr
      | round(3) }}, solar_sell={{ solar_sell_enabled }}, grid_charge={{ grid_charge_enabled
      }}, energy_priority={{ energy_priority | replace(' ', '_') }}, low_batt_soc_limit={{
      low_batt_soc_limit | round(0) }}, high_batt_soc_limit={{ high_batt_soc_limit
      | round(0) }}"

- id: deye_monitor_05_spot_price_cost_tracking
  alias: "Deye-Monitor-05 v1.0.2: Spot Price Cost Tracking"
  description: >
    Uses cached Energidata spot prices and live grid import/export power to track
    today's and yesterday's buy cost, sell value, PV production value, estimated
    battery discharge support value, and writes a retained daily summary CSV.
  triggers:
    - trigger: time_pattern
      minutes: /1
      id: accumulate
    - trigger: time
      at: "00:00:10"
      id: rollover
  conditions: []
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: rollover
          sequence:
            - variables:
                summary_date: "{{ (now() - timedelta(days=1)).strftime('%Y-%m-%d') }}"
                buy_today_kr: "{{ states('input_number.deye_grid_buy_cost_today_kr') | float(0) | round(2) }}"
                sell_today_kr: "{{ states('input_number.deye_grid_sell_value_today_kr') | float(0) | round(2) }}"
                pv_today_kr: "{{ states('input_number.deye_pv_value_today_kr') | float(0) | round(2) }}"
                battery_today_kr: "{{ states('input_number.deye_battery_discharge_value_today_kr') | float(0) | round(2) }}"
                consumption_kwh: "{{ state_attr('sensor.deye_consumption_today', 'last_period') | float(0) | round(3) }}"
                bought_kwh: "{{ state_attr('sensor.deye_grid_bought_today', 'last_period') | float(0) | round(3) }}"
                sold_kwh: "{{ state_attr('sensor.deye_grid_sold_today', 'last_period') | float(0) | round(3) }}"
                pv_kwh: "{{ state_attr('sensor.deye_pv_today', 'last_period') | float(0) | round(3) }}"
                batt_charge_kwh: "{{ state_attr('sensor.deye_battery_charge_today', 'last_period') | float(0) | round(3) }}"
                batt_discharge_kwh: "{{ state_attr('sensor.deye_battery_discharge_today', 'last_period') | float(0) | round(3) }}"
                pv_local_use_kwh: "{{ [((state_attr('sensor.deye_pv_today', 'last_period') | float(0)) - (state_attr('sensor.deye_grid_sold_today', 'last_period') | float(0))), 0] | max | round(3) }}"
                self_sufficiency_pct: >-
                  {% set consumption = state_attr('sensor.deye_consumption_today', 'last_period') | float(0) %}
                  {% set bought = state_attr('sensor.deye_grid_bought_today', 'last_period') | float(0) %}
                  {{ (((consumption - bought) / consumption) * 100) | round(1) if consumption > 0 else 0 }}
                avg_buy_price_kr: >-
                  {% set bought = state_attr('sensor.deye_grid_bought_today', 'last_period') | float(0) %}
                  {{ ((states('input_number.deye_grid_buy_cost_today_kr') | float(0)) / bought) | round(3) if bought > 0 else 0 }}
                avg_sell_price_kr: >-
                  {% set sold = state_attr('sensor.deye_grid_sold_today', 'last_period') | float(0) %}
                  {{ ((states('input_number.deye_grid_sell_value_today_kr') | float(0)) / sold) | round(3) if sold > 0 else 0 }}
                avg_pv_value_kr: >-
                  {% set pv = state_attr('sensor.deye_pv_today', 'last_period') | float(0) %}
                  {{ ((states('input_number.deye_pv_value_today_kr') | float(0)) / pv) | round(3) if pv > 0 else 0 }}
                summary_line: >-
                  {{ summary_date }},{{ pv_today_kr }},{{ sell_today_kr }},{{ buy_today_kr }},{{ (sell_today_kr | float(0) - buy_today_kr | float(0)) | round(2) }},{{ battery_today_kr }},{{ pv_kwh }},{{ sold_kwh }},{{ bought_kwh }},{{ consumption_kwh }},{{ batt_charge_kwh }},{{ batt_discharge_kwh }},{{ pv_local_use_kwh }},{{ self_sufficiency_pct }},{{ avg_buy_price_kr }},{{ avg_sell_price_kr }},{{ avg_pv_value_kr }}
            - action: shell_command.deye_daily_summary_append
              data:
                line: "{{ summary_line }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_buy_cost_yesterday_kr
              data:
                value: "{{ buy_today_kr }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_sell_value_yesterday_kr
              data:
                value: "{{ sell_today_kr }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_pv_value_yesterday_kr
              data:
                value: "{{ pv_today_kr }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_battery_discharge_value_yesterday_kr
              data:
                value: "{{ battery_today_kr }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_buy_cost_today_kr
              data:
                value: 0
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_sell_value_today_kr
              data:
                value: 0
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_pv_value_today_kr
              data:
                value: 0
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_battery_discharge_value_today_kr
              data:
                value: 0

        - conditions:
            - condition: trigger
              id: accumulate
            - condition: template
              value_template: >-
                {{ states('sensor.deye_spot_price_buy_now') not in ['unknown', 'unavailable', 'none', ''] }}
          sequence:
            - variables:
                grid_w: "{{ states('sensor.solarcust0186_total_grid_power') | float(0) }}"
                pv_w: "{{ states('sensor.solarcust0186_total_solar_power') | float(0) }}"
                batt_w: "{{ states('sensor.solarcust0186_battery_output_power') | float(0) }}"
                grid_import_w: "{{ grid_w if grid_w > 0 else 0 }}"
                grid_export_w: "{{ (grid_w * -1) if grid_w < 0 else 0 }}"
                batt_discharge_w: "{{ batt_w if batt_w > 50 else 0 }}"
                buy_price_kr: "{{ states('sensor.deye_spot_price_buy_now') | float(0) }}"
                sell_price_kr: "{{ states('sensor.deye_spot_price_sell_now') | float(0) }}"
                buy_increment_kr: "{{ ((grid_import_w / 1000) / 60 * buy_price_kr) | round(4) }}"
                sell_increment_kr: "{{ ((grid_export_w / 1000) / 60 * sell_price_kr) | round(4) }}"
                pv_increment_kr: "{{ ((pv_w / 1000) / 60 * sell_price_kr) | round(4) }}"
                battery_increment_kr: "{{ ((batt_discharge_w / 1000) / 60 * buy_price_kr) | round(4) }}"
                buy_today_kr: "{{ states('input_number.deye_grid_buy_cost_today_kr') | float(0) }}"
                sell_today_kr: "{{ states('input_number.deye_grid_sell_value_today_kr') | float(0) }}"
                pv_today_kr: "{{ states('input_number.deye_pv_value_today_kr') | float(0) }}"
                battery_today_kr: "{{ states('input_number.deye_battery_discharge_value_today_kr') | float(0) }}"
                buy_total_kr: "{{ states('input_number.deye_grid_buy_cost_total_kr') | float(0) }}"
                sell_total_kr: "{{ states('input_number.deye_grid_sell_value_total_kr') | float(0) }}"
                pv_total_kr: "{{ states('input_number.deye_pv_value_total_kr') | float(0) }}"
                battery_total_kr: "{{ states('input_number.deye_battery_discharge_value_total_kr') | float(0) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_buy_cost_today_kr
              data:
                value: "{{ (buy_today_kr + buy_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_sell_value_today_kr
              data:
                value: "{{ (sell_today_kr + sell_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_pv_value_today_kr
              data:
                value: "{{ (pv_today_kr + pv_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_battery_discharge_value_today_kr
              data:
                value: "{{ (battery_today_kr + battery_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_buy_cost_total_kr
              data:
                value: "{{ (buy_total_kr + buy_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_grid_sell_value_total_kr
              data:
                value: "{{ (sell_total_kr + sell_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_pv_value_total_kr
              data:
                value: "{{ (pv_total_kr + pv_increment_kr) | round(2) }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.deye_battery_discharge_value_total_kr
              data:
                value: "{{ (battery_total_kr + battery_increment_kr) | round(2) }}"
  mode: queued
  max: 5
