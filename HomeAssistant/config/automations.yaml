          | float(0)) }}"
        outdoor_temp: "{{ states('sensor.ecodan_outdoor_avg_60m') | float(0) }}"
        SUMMER_LOAD_THRESHOLD: 2200
        is_summer_load: "{{ load_avg < SUMMER_LOAD_THRESHOLD }}"
        is_high_load_stress: "{{ load_avg > 2500 or outdoor_temp < 2 }}"
        DISCHARGE_STRATEGY_A:
          "{% if is_winter %}\n  {% if is_high_load_stress %} 60
          {% else %} 65 {% endif %}\n{% else %}\n  {% if is_high_load_stress %} 90 {%
