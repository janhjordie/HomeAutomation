alias: "Deye-Monitor-04 v1.0.0: SoBa Energy CSV Logging"
description: >
  Logs SolarBalance energy and economics signals every minute using confirmed
  solarcust0186 entities. Focuses on house load, PV contribution, grid import /
  export, battery charge / discharge, and daily buy / sell totals.

triggers:
  - trigger: time_pattern
    minutes: /1

actions:
  - action: shell_command.deye_log_line
    data:
      line: "{{ line }}"

mode: queued
max: 5

variables:
  soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(0) }}"
  volt: "{{ states('sensor.solarcust0186_battery_voltage') | float(0) }}"

  load_w: "{{ states('sensor.solarcust0186_load_totalpower') | float(0) }}"
  pv_w: "{{ states('sensor.solarcust0186_total_solar_power') | float(0) }}"
  grid_w: "{{ states('sensor.solarcust0186_total_grid_power') | float(0) }}"
  batt_w: "{{ states('sensor.solarcust0186_battery_output_power') | float(0) }}"

  batt_mode: |-
    {% if batt_w > 50 %}
      discharge
    {% elif batt_w < -50 %}
      charge
    {% else %}
      idle
    {% endif %}

  batt_discharge_w: "{{ batt_w if batt_w > 0 else 0 }}"
  batt_charge_w: "{{ (batt_w * -1) if batt_w < 0 else 0 }}"
  grid_import_w: "{{ grid_w if grid_w > 0 else 0 }}"
  grid_export_w: "{{ (grid_w * -1) if grid_w < 0 else 0 }}"

  # Approximate energy flow breakdown for daily analysis.
  pv_to_house_w: "{{ [pv_w, load_w] | min | round(0) }}"
  batt_to_house_w: >-
    {{ [batt_discharge_w | float(0), [load_w - pv_to_house_w, 0] | max] | min | round(0) }}
  grid_to_house_w: >-
    {{ [load_w - pv_to_house_w - batt_to_house_w, 0] | max | round(0) }}
  pv_spill_or_export_w: >-
    {{ [pv_w - pv_to_house_w - batt_charge_w, 0] | max | round(0) }}

  daily_consumption_kwh: "{{ states('sensor.solarcust0186_daily_consumption') | float(0) }}"
  daily_bought_kwh: "{{ states('sensor.solarcust0186_daily_energy_bought') | float(0) }}"
  daily_sold_kwh: "{{ states('sensor.solarcust0186_daily_energy_sold') | float(0) }}"
  daily_pv_kwh: "{{ states('sensor.solarcust0186_daily_pv_production') | float(0) }}"
  daily_batt_charge_kwh: "{{ states('sensor.solarcust0186_today_charge_of_the_battery') | float(0) }}"
  daily_batt_discharge_kwh: "{{ states('sensor.solarcust0186_today_discharge_of_the_battery') | float(0) }}"

  total_consumption_kwh: "{{ states('sensor.solarcust0186_total_consumption') | float(0) }}"
  total_bought_kwh: "{{ states('sensor.solarcust0186_total_energy_bought') | float(0) }}"
  total_sold_kwh: "{{ states('sensor.solarcust0186_total_energy_sold') | float(0) }}"
  total_pv_kwh: "{{ states('sensor.solarcust0186_total_pv_production') | float(0) }}"

  current_buy_price_kr: "{{ states('sensor.solarcust0186_text1') | replace(' kr', '') | float(0) }}"
  solar_sell_enabled: "{{ states('switch.solarcust0186_solar_sell') }}"
  grid_charge_enabled: "{{ states('switch.solarcust0186_grid_charge') }}"
  energy_priority: "{{ states('select.solarcust0186_energy_priority') }}"
  low_batt_soc_limit: "{{ states('number.solarcust0186_soba_low_batt_soc_limit') | float(0) }}"
  high_batt_soc_limit: "{{ states('number.solarcust0186_soba_high_batt_soc_limit') | float(0) }}"

  line: >-
    {{ now().isoformat() }},
    tag=soba_energy,
    soc={{ soc | round(1) }},
    volt={{ volt | round(2) }},
    load_w={{ load_w | round(0) }},
    pv_w={{ pv_w | round(0) }},
    batt_w={{ batt_w | round(0) }},
    batt_mode={{ batt_mode }},
    batt_charge_w={{ batt_charge_w | round(0) }},
    batt_discharge_w={{ batt_discharge_w | round(0) }},
    grid_w={{ grid_w | round(0) }},
    grid_import_w={{ grid_import_w | round(0) }},
    grid_export_w={{ grid_export_w | round(0) }},
    pv_to_house_w={{ pv_to_house_w }},
    batt_to_house_w={{ batt_to_house_w }},
    grid_to_house_w={{ grid_to_house_w }},
    pv_spill_or_export_w={{ pv_spill_or_export_w }},
    daily_consumption_kwh={{ daily_consumption_kwh | round(3) }},
    daily_bought_kwh={{ daily_bought_kwh | round(3) }},
    daily_sold_kwh={{ daily_sold_kwh | round(3) }},
    daily_pv_kwh={{ daily_pv_kwh | round(3) }},
    daily_batt_charge_kwh={{ daily_batt_charge_kwh | round(3) }},
    daily_batt_discharge_kwh={{ daily_batt_discharge_kwh | round(3) }},
    total_consumption_kwh={{ total_consumption_kwh | round(1) }},
    total_bought_kwh={{ total_bought_kwh | round(1) }},
    total_sold_kwh={{ total_sold_kwh | round(1) }},
    total_pv_kwh={{ total_pv_kwh | round(1) }},
    buy_price_kr={{ current_buy_price_kr | round(3) }},
    solar_sell={{ solar_sell_enabled }},
    grid_charge={{ grid_charge_enabled }},
    energy_priority={{ energy_priority | replace(' ', '_') }},
    low_batt_soc_limit={{ low_batt_soc_limit | round(0) }},
    high_batt_soc_limit={{ high_batt_soc_limit | round(0) }}