alias: >-
  Deye-05 v1.0.0: Manual Charge Debug Force Write
description: >
  One-shot debug automation for isolating inverter or integration blocking.
  Run this manually from the Automation UI. It force-writes the emergency
  charge entities, waits briefly, and then reports the actual resulting states.
triggers: []
conditions: []
actions:
  - variables:
      soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(50) }}"
      batt_v: "{{ states('sensor.solarcust0186_battery_voltage') | float(48) }}"
      EMERGENCY_CHARGE_A: 5
      RECOVERY_SOC: 40
      current_hour: "{{ now().hour }}"
      active_tou_entity: >-
        {% if current_hour < 6 %}
          number.solarcust0186_time_point_1_batt_charge_limit
        {% elif current_hour < 10 %}
          number.solarcust0186_time_point_2_batt_charge_limit
        {% elif current_hour < 14 %}
          number.solarcust0186_time_point_3_batt_charge_limit
        {% elif current_hour < 17 %}
          number.solarcust0186_time_point_4_batt_charge_limit
        {% elif current_hour < 21 %}
          number.solarcust0186_time_point_5_batt_charge_limit
        {% else %}
          number.solarcust0186_time_point_6_batt_charge_limit
        {% endif %}
      emergency_tou_limit: >-
        {% set soc_int = soc | round(0) | int %}
        {{ [[soc_int + 5, RECOVERY_SOC] | max, 100] | min }}
  - action: persistent_notification.create
    data:
      notification_id: deye_manual_charge_debug_start
      title: "🔧 Deye Manual Charge Debug Started"
      message: >
        Writing emergency charge entities now.
        SOC: {{ soc | round(1) }}% | Voltage: {{ batt_v | round(2) }}V
        Active TOU: {{ active_tou_entity.split('.')[-1] }} → {{ emergency_tou_limit }}%
        Time: {{ now().strftime('%H:%M:%S') }}
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.deye_emergency_charge_needed
  - action: switch.turn_off
    target:
      entity_id: switch.solarcust0186_solarbalance_enabled
    continue_on_error: true
  - action: switch.turn_on
    target:
      entity_id: switch.solarcust0186_grid_charge
  - delay: "00:00:02"
  - action: number.set_value
    target:
      entity_id: number.solarcust0186_maximum_battery_charge_current
    data:
      value: "{{ EMERGENCY_CHARGE_A }}"
  - action: number.set_value
    target:
      entity_id: number.solarcust0186_maximum_battery_grid_charge_current
    data:
      value: "{{ EMERGENCY_CHARGE_A }}"
  - action: number.set_value
    target:
      entity_id: "{{ active_tou_entity }}"
    data:
      value: "{{ emergency_tou_limit }}"
  - action: number.set_value
    target:
      entity_id: number.solarcust0186_batt_charge_limit
    data:
      value: "{{ emergency_tou_limit }}"
  - action: number.set_value
    target:
      entity_id: number.solarcust0186_soba_low_batt_soc_limit
    data:
      value: "{{ emergency_tou_limit }}"
  - delay: "00:00:03"
  - action: persistent_notification.create
    data:
      notification_id: deye_manual_charge_debug_result
      title: "📋 Deye Manual Charge Debug Result"
      message: >
        Grid charge switch: {{ states('switch.solarcust0186_grid_charge') }}
        SolarBalance enabled: {{ states('switch.solarcust0186_solarbalance_enabled') }}
        Max battery charge current: {{ states('number.solarcust0186_maximum_battery_charge_current') }}A
        Max battery grid charge current: {{ states('number.solarcust0186_maximum_battery_grid_charge_current') }}A
        Battery charge limit: {{ states('number.solarcust0186_batt_charge_limit') }}%
        SoBa low batt SOC limit: {{ states('number.solarcust0186_soba_low_batt_soc_limit') }}%
        Active TOU {{ active_tou_entity.split('.')[-1] }}: {{ states(active_tou_entity) }}%
        Battery mode: {{ states('sensor.solarcust0186_battery_mode') if states('sensor.solarcust0186_battery_mode') not in ['unknown','unavailable'] else 'n/a' }}
        Battery charge power: {{ states('sensor.solarcust0186_battery_charge_power') if states('sensor.solarcust0186_battery_charge_power') not in ['unknown','unavailable'] else 'n/a' }}
        Time: {{ now().strftime('%H:%M:%S') }}
mode: single