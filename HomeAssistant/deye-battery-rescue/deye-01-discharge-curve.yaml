alias: "Deye-01 v1.0.74: Pure Discharge Limiter with Dynamic TOU"
description: >
  Controls discharge with an always-on SOC curve and dynamic TOU slot
  detection. The active TOU charge-limit entity is selected from the current
  inverter time-point starts, and discharge is only allowed when current SOC is
  above the active TOU limit. When TOU allows discharge, the discharge cap is
  always enforced from the SOC curve and battery voltage.
triggers:
  - id: discharge_changed
    trigger: state
    entity_id: number.solarcust0186_maximum_battery_discharge_current
  - id: soc_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_charge_level
  - id: voltage_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_voltage
  - id: tou_changed_1
    trigger: state
    entity_id: number.solarcust0186_time_point_1_batt_charge_limit
  - id: tou_changed_2
    trigger: state
    entity_id: number.solarcust0186_time_point_2_batt_charge_limit
  - id: tou_changed_3
    trigger: state
    entity_id: number.solarcust0186_time_point_3_batt_charge_limit
  - id: tou_changed_4
    trigger: state
    entity_id: number.solarcust0186_time_point_4_batt_charge_limit
  - id: tou_changed_5
    trigger: state
    entity_id: number.solarcust0186_time_point_5_batt_charge_limit
  - id: tou_changed_6
    trigger: state
    entity_id: number.solarcust0186_time_point_6_batt_charge_limit
  - id: tou_start_changed_1
    trigger: state
    entity_id: number.solarcust0186_time_point_1_start
  - id: tou_start_changed_2
    trigger: state
    entity_id: number.solarcust0186_time_point_2_start
  - id: tou_start_changed_3
    trigger: state
    entity_id: number.solarcust0186_time_point_3_start
  - id: tou_start_changed_4
    trigger: state
    entity_id: number.solarcust0186_time_point_4_start
  - id: tou_start_changed_5
    trigger: state
    entity_id: number.solarcust0186_time_point_5_start
  - id: tou_start_changed_6
    trigger: state
    entity_id: number.solarcust0186_time_point_6_start
  - id: ha_start
    trigger: homeassistant
    event: start
  - id: periodic
    trigger: time_pattern
    seconds: /30
conditions: []
actions:
  - variables:
      soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(50) }}"
      batt_v: "{{ states('sensor.solarcust0186_battery_voltage') | float(48) }}"
      current_cap_a: >-
        {{ states('number.solarcust0186_maximum_battery_discharge_current') |
        float(0) }}
      load_avg: >-
        {{ states('sensor.house_load_avg_15m') |
        float(states('sensor.solarcust0186_load_totalpower') | float(0)) }}
      outdoor_temp: "{{ states('sensor.ecodan_outdoor_avg_60m') | float(0) }}"
      DISCHARGE_STRATEGY_A: |-
        {% set winter = now().month in [10, 11, 12, 1, 2, 3] %}
        {% set high_stress = (load_avg | float(0)) > 2500 or (outdoor_temp | float(0)) < 2 %}
        {% if winter %}
          {% if high_stress %} 60 {% else %} 65 {% endif %}
        {% else %}
          90
        {% endif %}
      DISCHARGE_MAX_A: "{{ DISCHARGE_STRATEGY_A }}"
      SOC_CURVE_MAX: 50
      SOC_CURVE_MIN: 25
      POWER_MAX: 2500
      POWER_MIN: 600
      current_time_hhmm: "{{ now().hour * 100 + now().minute }}"
      active_tou_entity: >-
        {% set schedule = [
          {'start': states('number.solarcust0186_time_point_1_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_1_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_2_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_2_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_3_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_3_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_4_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_4_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_5_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_5_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_6_start') | int(0), 'limit_entity': 'number.solarcust0186_time_point_6_batt_charge_limit'}
        ] %}
        {% set now_hhmm = current_time_hhmm | int %}
        {% set active = namespace(limit_entity=schedule[0].limit_entity) %}
        {% for slot in schedule %}
          {% set next_slot = schedule[(loop.index0 + 1) % (schedule | count)] %}
          {% set start = slot.start | int %}
          {% set next_start = next_slot.start | int %}
          {% set in_slot = (now_hhmm >= start and now_hhmm < next_start) if start < next_start else (now_hhmm >= start or now_hhmm < next_start) %}
          {% if in_slot %}
            {% set active.limit_entity = slot.limit_entity %}
          {% endif %}
        {% endfor %}
        {{ active.limit_entity }}
      active_tou_limit: "{{ states(active_tou_entity) | float(0) }}"
      tou_allows_discharge: "{{ (soc | float(50)) > (active_tou_limit | float(0)) }}"
      soc_limit_a: |-
        {% set soc_min = SOC_CURVE_MIN | float(25) %}
        {% set soc_max = SOC_CURVE_MAX | float(50) %}
        {% set power_min = POWER_MIN | float(600) %}
        {% set power_max = POWER_MAX | float(2500) %}
        {% set soc_value = soc | float(50) %}
        {% set batt_v_safe = [batt_v | float(48), 1] | max %}

        {% if soc_value >= soc_max %}
          {{ (power_max / batt_v_safe) | round(0) }}
        {% elif soc_value <= soc_min %}
          {{ (power_min / batt_v_safe) | round(0) }}
        {% else %}
          {% set ratio = (soc_value - soc_min) / (soc_max - soc_min) %}
          {% set power_limit = power_min + ((power_max - power_min) * ratio) %}
          {{ (power_limit / batt_v_safe) | round(0) }}
        {% endif %}
      target_discharge_a: >-
        {% if tou_allows_discharge %}
          {{ [soc_limit_a | int(0), DISCHARGE_MAX_A | int(0)] | min }}
        {% else %}
          0
        {% endif %}
      needs_enforce: >-
        {{ (current_cap_a | float(0) | round(0) | int) != (target_discharge_a | float(0) | round(0) |
        int) }}
  - if:
      - condition: template
        value_template: "{{ needs_enforce }}"
    then:
      - action: number.set_value
        target:
          entity_id: number.solarcust0186_maximum_battery_discharge_current
        data:
          value: "{{ target_discharge_a }}"
mode: queued
max: 10
