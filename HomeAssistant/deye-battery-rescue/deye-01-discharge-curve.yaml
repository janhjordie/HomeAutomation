alias: "Deye-01 v1.0.83: Pure Discharge Limiter with Dynamic TOU"
description: >
  Controls discharge with dynamic TOU slot detection. The active TOU
  charge-limit entity is selected from the current inverter time-point starts.
  The SOC curve is only enforced when the active dynamic TOU limit is 15% and
  current SOC is at or below SOC_CURVE_MAX. When TOU is above the curve limit
  and SOC is above SOC_CURVE_MAX, the automation leaves the current discharge
  unchanged. A hard voltage floor at 50.0V forces discharge to 0A.
triggers:
  - id: discharge_changed
    trigger: state
    entity_id: number.solarcust0186_maximum_battery_discharge_current
  - id: soc_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_charge_level
  - id: voltage_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_voltage
  - id: tou_changed_1
    trigger: state
    entity_id: number.solarcust0186_time_point_1_batt_charge_limit
  - id: tou_changed_2
    trigger: state
    entity_id: number.solarcust0186_time_point_2_batt_charge_limit
  - id: tou_changed_3
    trigger: state
    entity_id: number.solarcust0186_time_point_3_batt_charge_limit
  - id: tou_changed_4
    trigger: state
    entity_id: number.solarcust0186_time_point_4_batt_charge_limit
  - id: tou_changed_5
    trigger: state
    entity_id: number.solarcust0186_time_point_5_batt_charge_limit
  - id: tou_changed_6
    trigger: state
    entity_id: number.solarcust0186_time_point_6_batt_charge_limit
  - id: tou_start_changed_1
    trigger: state
    entity_id: number.solarcust0186_time_point_1_start
  - id: tou_start_changed_2
    trigger: state
    entity_id: number.solarcust0186_time_point_2_start
  - id: tou_start_changed_3
    trigger: state
    entity_id: number.solarcust0186_time_point_3_start
  - id: tou_start_changed_4
    trigger: state
    entity_id: number.solarcust0186_time_point_4_start
  - id: tou_start_changed_5
    trigger: state
    entity_id: number.solarcust0186_time_point_5_start
  - id: tou_start_changed_6
    trigger: state
    entity_id: number.solarcust0186_time_point_6_start
  - id: ha_start
    trigger: homeassistant
    event: start
  - id: periodic
    trigger: time_pattern
    seconds: /30
conditions: []
actions:
  - variables:
      HIGH_STRESS_LOAD_W: 2500
      HIGH_STRESS_OUTDOOR_TEMP_C: 2
      WINTER_DISCHARGE_HIGH_STRESS_A: 60
      WINTER_DISCHARGE_NORMAL_A: 65
      SUMMER_DISCHARGE_A: 90
      SOC_CURVE_MAX: 40
      SOC_CURVE_MIN: 15
      CURVE_TOU_LIMIT: 15
      SOC_CURVE_POWER_MAX: 2500
      SOC_CURVE_POWER_MIN: 600
      VOLTAGE_FLOOR_V: 50.0
      MIN_BATTERY_V_FOR_DIVISION: 1
      soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float }}"
      batt_v: "{{ states('sensor.solarcust0186_battery_voltage') | float }}"
      current_cap_a: >-
        {{ states('number.solarcust0186_maximum_battery_discharge_current') |
        float }}
      load_avg: >-
        {{ states('sensor.house_load_avg_15m') | float }}
      outdoor_temp: "{{ states('sensor.ecodan_outdoor_avg_60m') | float }}"
      DISCHARGE_STRATEGY_LIMIT_SOURCE_A: |-
        {% set winter = now().month in [10, 11, 12, 1, 2, 3] %}
        {% set high_stress = (load_avg | float) > HIGH_STRESS_LOAD_W or (outdoor_temp | float) < HIGH_STRESS_OUTDOOR_TEMP_C %}
        {% if winter %}
          {% if high_stress %} {{ WINTER_DISCHARGE_HIGH_STRESS_A }} {% else %} {{ WINTER_DISCHARGE_NORMAL_A }} {% endif %}
        {% else %}
          {{ SUMMER_DISCHARGE_A }}
        {% endif %}
      DISCHARGE_STRATEGY_LIMIT_A: "{{ DISCHARGE_STRATEGY_LIMIT_SOURCE_A }}"
      current_time_hhmm: "{{ now().hour * 100 + now().minute }}"
      active_tou_entity: >-
        {% set schedule = [
          {'start': states('number.solarcust0186_time_point_1_start') | int, 'limit_entity': 'number.solarcust0186_time_point_1_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_2_start') | int, 'limit_entity': 'number.solarcust0186_time_point_2_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_3_start') | int, 'limit_entity': 'number.solarcust0186_time_point_3_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_4_start') | int, 'limit_entity': 'number.solarcust0186_time_point_4_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_5_start') | int, 'limit_entity': 'number.solarcust0186_time_point_5_batt_charge_limit'},
          {'start': states('number.solarcust0186_time_point_6_start') | int, 'limit_entity': 'number.solarcust0186_time_point_6_batt_charge_limit'}
        ] %}
        {% set now_hhmm = current_time_hhmm | int %}
        {% set active = namespace(limit_entity=schedule[0].limit_entity) %}
        {% for slot in schedule %}
          {% set next_slot = schedule[(loop.index0 + 1) % (schedule | count)] %}
          {% set start = slot.start | int %}
          {% set next_start = next_slot.start | int %}
          {% set in_slot = (now_hhmm >= start and now_hhmm < next_start) if start < next_start else (now_hhmm >= start or now_hhmm < next_start) %}
          {% if in_slot %}
            {% set active.limit_entity = slot.limit_entity %}
          {% endif %}
        {% endfor %}
        {{ active.limit_entity }}
      active_tou_limit: "{{ states(active_tou_entity) | float }}"
      dynamic_tou_is_curve_slot: >-
        {{ (active_tou_limit | float | round(0) | int) == CURVE_TOU_LIMIT }}
      no_action_zone: >-
        {{ (active_tou_limit | float) > CURVE_TOU_LIMIT and (soc | float) > SOC_CURVE_MAX }}
      discharge_curve_active: >-
        {{ (soc | float) <= SOC_CURVE_MAX and dynamic_tou_is_curve_slot }}
      voltage_floor_hit: "{{ (batt_v | float) <= VOLTAGE_FLOOR_V }}"
      soc_limit_a: |-
        {% set soc_min = SOC_CURVE_MIN %}
        {% set soc_max = SOC_CURVE_MAX %}
        {% set power_min = SOC_CURVE_POWER_MIN %}
        {% set power_max = SOC_CURVE_POWER_MAX %}
        {% set soc_value = soc | float %}
        {% set batt_v_safe = [batt_v | float, MIN_BATTERY_V_FOR_DIVISION] | max %}

        {% if soc_value >= soc_max %}
          {{ (power_max / batt_v_safe) | round(0) }}
        {% elif soc_value <= soc_min %}
          {{ (power_min / batt_v_safe) | round(0) }}
        {% else %}
          {% set ratio = (soc_value - soc_min) / (soc_max - soc_min) %}
          {% set power_limit = power_min + ((power_max - power_min) * ratio) %}
          {{ (power_limit / batt_v_safe) | round(0) }}
        {% endif %}
      target_discharge_a: >-
        {% if voltage_floor_hit %}
          0
        {% elif no_action_zone %}
          {{ current_cap_a | int }}
        {% elif discharge_curve_active %}
          {{ [soc_limit_a | int, DISCHARGE_STRATEGY_LIMIT_A | int] | min }}
        {% else %}
          {{ DISCHARGE_STRATEGY_LIMIT_A | int }}
        {% endif %}
      needs_enforce: >-
        {{ (current_cap_a | float | round(0) | int) != (target_discharge_a | float | round(0) |
        int) }}
  - if:
      - condition: template
        value_template: "{{ needs_enforce }}"
    then:
      - action: number.set_value
        target:
          entity_id: number.solarcust0186_maximum_battery_discharge_current
        data:
          value: "{{ target_discharge_a }}"
mode: queued
max: 10
