alias: >-
  Deye-01 v1.0.63: Pure Discharge Limiter with Linear SOC Curves
description: >
  Controls discharge using load-aware logic + linear seasonal SOC curves.
  LINEAR SOC CURVES:
  - Summer Mode (Load avg < 2200W): Smoothly scales 25A → 5A between 30% → 15% SOC
  - Winter Mode (Load avg ≥ 2200W): Smoothly scales 60A → 8A between 40% → 15% SOC
  ADAPTIVE MODE:
  - High Stress (Load > 2500W avg OR Temp < 2°C): Strict SOC curve (max 60A/90A)
  - Low Stress: Relaxed 65A limit (relies on voltage floor for safety)
  VOLTAGE FLOOR: When voltage < 48.0V → 0A discharge + triggers charge automation
triggers:
  - id: discharge_changed
    trigger: state
    entity_id: number.solarcust0186_maximum_battery_discharge_current
  - id: soc_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_charge_level
  - id: voltage_changed
    trigger: state
    entity_id: sensor.solarcust0186_battery_voltage
  - id: ha_start
    trigger: homeassistant
    event: start
  - id: periodic
    trigger: time_pattern
    seconds: /30
conditions: []
actions:
  - variables:
      soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(50) }}"
      batt_v: "{{ states('sensor.solarcust0186_battery_voltage') | float(48) }}"
      current_cap_a: >-
        {{ states('number.solarcust0186_maximum_battery_discharge_current') |
        float(0) }}
      is_winter: "{{ now().month in [10, 11, 12, 1, 2, 3] }}"
      # --- Adaptive Stress Logic ---
      # High Load: Avg load > 2500W OR Outdoor Temp < 2°C (Heat pump working hard)
      # If low stress: Use 65A limit (relaxed). If high stress: Use strict SOC curve.
      load_avg: "{{ states('sensor.house_load_avg_15m') | float(states('sensor.solarcust0186_load_totalpower') | float(0)) }}"
      outdoor_temp: "{{ states('sensor.ecodan_outdoor_avg_60m') | float(0) }}"
      # Summer/Winter Load Detection
      SUMMER_LOAD_THRESHOLD: 2200
      is_summer_load: "{{ load_avg < SUMMER_LOAD_THRESHOLD }}"
      is_high_load_stress: "{{ load_avg > 2500 or outdoor_temp < 2 }}"
      # Limit Logic:
      # - Winter + High Stress = 60A (Protect battery)
      # - Summer + High Stress = 90A (Full power)
      # - Low Stress (Any season) = 65A (Relaxed limit for efficiency, overrides low SOC tiers)
      DISCHARGE_STRATEGY_A: >-
        {% if is_winter %}
          {% if is_high_load_stress %} 60 {% else %} 65 {% endif %}
        {% else %}
          {% if is_high_load_stress %} 90 {% else %} 90 {% endif %}
        {% endif %}
      DISCHARGE_MAX_A: "{{ DISCHARGE_STRATEGY_A }}"
      # --- Seasonal SOC Curves ---
      # Define Start and End Points for pure linear interpolation
      
      # Winter Curve (Strict protection for high loads)
      W_SOC_MAX: 40
      W_SOC_MIN: 15
      W_AMP_MAX: 60
      W_AMP_MIN: 8

      # Summer Curve (Relaxed protection for low loads)
      S_SOC_MAX: 30
      S_SOC_MIN: 15
      S_AMP_MAX: 25
      S_AMP_MIN: 5

      # Active Curve Selection (based on load average)
      ACTIVE_SOC_MAX: "{{ S_SOC_MAX if is_summer_load else W_SOC_MAX }}"
      ACTIVE_SOC_MIN: "{{ S_SOC_MIN if is_summer_load else W_SOC_MIN }}"
      ACTIVE_AMP_MAX: "{{ S_AMP_MAX if is_summer_load else W_AMP_MAX }}"
      ACTIVE_AMP_MIN: "{{ S_AMP_MIN if is_summer_load else W_AMP_MIN }}"
      
      POWER_MIN: 600
      # Voltage floor check - trigger charge automation if needed
      voltage_critical: "{{ batt_v < 48.0 }}"
      soc_emergency: "{{ soc <= 15 }}"
      volt_limit_a: |-
        {% if batt_v < 48.0 %}
          0
        {% elif batt_v < 48.2 %}
          3
        {% elif batt_v < 48.5 %}
          8
        {% elif batt_v < 49.0 %}
          15
        {% elif batt_v < 49.5 %}
          30
        {% elif batt_v < 50.0 %}
          50
        {% else %}
          {{ DISCHARGE_MAX_A }}
        {% endif %}
      soc_limit_a: |-
        {% if not is_high_load_stress and soc >= 50 %}
          {{ DISCHARGE_MAX_A }}
        {% else %}
          {% set v_min_calc = (POWER_MIN / batt_v) | round(0) %}
          {% set v_min_absolute = [v_min_calc, ACTIVE_AMP_MIN] | min %}
          
          {% if soc >= ACTIVE_SOC_MAX %}
            {{ ACTIVE_AMP_MAX }}
          {% elif soc <= ACTIVE_SOC_MIN %}
            {{ v_min_absolute }}
          {% else %}
            {% set ratio = (soc - ACTIVE_SOC_MIN) / (ACTIVE_SOC_MAX - ACTIVE_SOC_MIN) %}
            {{ (ACTIVE_AMP_MIN + (ACTIVE_AMP_MAX - ACTIVE_AMP_MIN) * ratio) | round(0) }}
          {% endif %}
        {% endif %}
      target_discharge_a: >-
        {% if voltage_critical or soc_emergency %}
          0
        {% else %}
          {{ [soc_limit_a | int, volt_limit_a | int] | min }}
        {% endif %}
      needs_enforce: >-
        {{ (current_cap_a | round(0) | int) != (target_discharge_a | round(0) |
        int) }}
  - if:
      - condition: template
        value_template: "{{ (voltage_critical or soc_emergency) and not is_state('input_boolean.deye_emergency_charge_needed', 'on') }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.deye_emergency_charge_needed
      - action: persistent_notification.create
        data:
          notification_id: deye_charge_trigger_activated
          title: 🔋 CRITICAL BATTERY - CHARGE TRIGGERED
          message: >
            {% if voltage_critical %}
            Voltage {{ batt_v | round(2) }}V < 48.0V detected.
            {% else %}
            SOC {{ soc | round(1) }}% ≤ 15% (SolarBalance minimum) detected.
            {% endif %}
            Discharge set to 0A. Charge automation triggered.
            SOC: {{ soc | round(1) }}% | Voltage: {{ batt_v | round(2) }}V
            Time: {{ now().strftime('%H:%M:%S') }}
  - if:
      - condition: template
        value_template: "{{ needs_enforce }}"
    then:
      - action: number.set_value
        target:
          entity_id: number.solarcust0186_maximum_battery_discharge_current
        data:
          value: "{{ target_discharge_a }}"
mode: queued
max: 10