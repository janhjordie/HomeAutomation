alias: >-
  Deye-01-Charge-Trigger v1.0.4: Emergency Battery Charging (5A Active TOU)
description: >
  Enforces emergency battery charging while the low-voltage latch is active.
  Sets the currently active TOU battery charge limit above current SOC and above
  the 40% recovery threshold, raises battery charge-limit guards, disables
  SolarBalance, enables 5A grid charging, and keeps those settings in place
  until the discharge limiter releases the latch.
triggers:
  - id: latch_changed
    trigger: state
    entity_id: input_boolean.deye_emergency_charge_needed
  - id: periodic
    trigger: time_pattern
    seconds: /30
  - id: ha_start
    trigger: homeassistant
    event: start
conditions: []
actions:
  - variables:
      emergency_charge_needed: "{{ is_state('input_boolean.deye_emergency_charge_needed', 'on') }}"
      batt_v: "{{ states('sensor.solarcust0186_battery_voltage') | float(48) }}"
      soc: "{{ states('sensor.solarcust0186_battery_charge_level') | float(50) }}"
      EMERGENCY_CHARGE_A: 5
      RECOVERY_SOC: 40
      NORMAL_TOU_LIMIT: 90
      current_hour: "{{ now().hour }}"
      active_tou_entity: >-
        {% if current_hour < 6 %}
          number.solarcust0186_time_point_1_batt_charge_limit
        {% elif current_hour < 10 %}
          number.solarcust0186_time_point_2_batt_charge_limit
        {% elif current_hour < 14 %}
          number.solarcust0186_time_point_3_batt_charge_limit
        {% elif current_hour < 17 %}
          number.solarcust0186_time_point_4_batt_charge_limit
        {% elif current_hour < 21 %}
          number.solarcust0186_time_point_5_batt_charge_limit
        {% else %}
          number.solarcust0186_time_point_6_batt_charge_limit
        {% endif %}
      emergency_tou_limit: >-
        {% set soc_int = soc | round(0) | int %}
        {{ [[soc_int + 5, RECOVERY_SOC] | max, 100] | min }}
      active_tou_limit: "{{ states(active_tou_entity) | int(0) }}"
      batt_charge_limit: "{{ states('number.solarcust0186_batt_charge_limit') | int(0) }}"
      soba_low_batt_soc_limit: "{{ states('number.solarcust0186_soba_low_batt_soc_limit') | int(0) }}"
      grid_charge_on: "{{ is_state('switch.solarcust0186_grid_charge', 'on') }}"
      solarbalance_enabled: "{{ is_state('switch.solarcust0186_solarbalance_enabled', 'on') }}"
      charge_current_a: "{{ states('number.solarcust0186_maximum_battery_charge_current') | int(0) }}"
      grid_charge_current_a: "{{ states('number.solarcust0186_maximum_battery_grid_charge_current') | int(0) }}"
      start_time: "{{ now().isoformat() }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ emergency_charge_needed }}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'latch_changed' and trigger.to_state is not none
                  and trigger.to_state.state == 'on' }}
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.deye_charge_start_time
                data:
                  datetime: "{{ start_time }}"
          - if:
              - condition: template
                value_template: "{{ not grid_charge_on }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.solarcust0186_grid_charge
          - if:
              - condition: template
                value_template: "{{ grid_charge_current_a != EMERGENCY_CHARGE_A }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_maximum_battery_grid_charge_current
                data:
                  value: "{{ EMERGENCY_CHARGE_A }}"
          - if:
              - condition: template
                value_template: "{{ charge_current_a != EMERGENCY_CHARGE_A }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_maximum_battery_charge_current
                data:
                  value: "{{ EMERGENCY_CHARGE_A }}"
          - if:
              - condition: template
                value_template: "{{ active_tou_limit != (emergency_tou_limit | int) }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ active_tou_entity }}"
                data:
                  value: "{{ emergency_tou_limit }}"
          - if:
              - condition: template
                value_template: "{{ batt_charge_limit != (emergency_tou_limit | int) }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_batt_charge_limit
                data:
                  value: "{{ emergency_tou_limit }}"
          - if:
              - condition: template
                value_template: "{{ soba_low_batt_soc_limit != (emergency_tou_limit | int) }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_soba_low_batt_soc_limit
                data:
                  value: "{{ emergency_tou_limit }}"
          - if:
              - condition: template
                value_template: "{{ solarbalance_enabled }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.solarcust0186_solarbalance_enabled
                continue_on_error: true
          - if:
              - condition: template
                value_template: >-
                  {{ trigger.id == 'latch_changed' and trigger.to_state is not none
                  and trigger.to_state.state == 'on' }}
            then:
              - action: persistent_notification.create
                data:
                  notification_id: deye_emergency_charge_started
                  title: 🔋 EMERGENCY CHARGE STARTED (5A ACTIVE TOU)
                  message: >
                    Critical voltage latch is active.
                    SolarBalance disabled and charge guards raised.
                    Grid charging forced ON at {{ EMERGENCY_CHARGE_A }}A.
                    Active TOU slot {{ active_tou_entity.split('.')[-1] }} set to {{ emergency_tou_limit }}%.
                    SOC: {{ soc | round(1) }}% | Voltage: {{ batt_v | round(2) }}V
                    Started: {{ now().strftime('%H:%M:%S') }}
      - conditions:
          - condition: template
            value_template: >-
              {{ not emergency_charge_needed and trigger.id == 'latch_changed'
              and trigger.to_state is not none and trigger.to_state.state == 'off' }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ grid_charge_on }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: switch.solarcust0186_grid_charge
          - if:
              - condition: template
                value_template: "{{ active_tou_limit != NORMAL_TOU_LIMIT }}"
            then:
              - action: number.set_value
                target:
                  entity_id: "{{ active_tou_entity }}"
                data:
                  value: "{{ NORMAL_TOU_LIMIT }}"
          - if:
              - condition: template
                value_template: "{{ batt_charge_limit != NORMAL_TOU_LIMIT }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_batt_charge_limit
                data:
                  value: "{{ NORMAL_TOU_LIMIT }}"
          - if:
              - condition: template
                value_template: "{{ soba_low_batt_soc_limit != NORMAL_TOU_LIMIT }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.solarcust0186_soba_low_batt_soc_limit
                data:
                  value: "{{ NORMAL_TOU_LIMIT }}"
          - if:
              - condition: template
                value_template: "{{ not solarbalance_enabled }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: switch.solarcust0186_solarbalance_enabled
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ true }}"
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.deye_charge_end_time
                data:
                  datetime: "{{ now().isoformat() }}"
              - action: persistent_notification.create
                data:
                  notification_id: deye_emergency_charge_completed
                  title: ✅ EMERGENCY CHARGE COMPLETED - LATCH RELEASED
                  message: >
                    Emergency charge latch released.
                    Grid charge turned OFF, charge guards restored to {{ NORMAL_TOU_LIMIT }}%,
                    and SolarBalance re-enabled.
                    Final Voltage: {{ batt_v | round(2) }}V | Final SOC: {{ soc | round(1) }}%
                    Completed: {{ now().strftime('%H:%M:%S') }}
mode: single