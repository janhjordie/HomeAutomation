# Helper entities for Deye battery automation communication
# Add this to your configuration.yaml or include it in a separate helpers.yaml file

input_boolean:
  deye_emergency_charge_needed:
    name: "Deye Emergency Charge Needed"
    icon: mdi:battery-alert

  deye_manual_emergency_charge:
    name: "Deye Manual Emergency Charge"
    icon: mdi:battery-charging-high

  deye_manual_grid_sell:
    name: "Deye Manual Grid Sell"
    icon: mdi:transmission-tower-export

input_datetime:
  deye_charge_start_time:
    name: "Deye Charge Start Time"
    has_date: true
    has_time: true
    
  deye_charge_end_time:
    name: "Deye Charge End Time"
    has_date: true
    has_time: true