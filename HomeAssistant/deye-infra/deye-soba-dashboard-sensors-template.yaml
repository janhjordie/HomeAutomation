sensor:
  - name: "Deye Spot Price Buy Now"
    unique_id: deye_spot_price_buy_now
    unit_of_measurement: "kr/kWh"
    state_class: measurement
    state: >-
      {% set records = state_attr('sensor.deye_spot_price_cache', 'records') | default([], true) %}
      {% set ns = namespace(total=none) %}
      {% set current_date = now().strftime('%Y-%m-%d') %}
      {% set current_hour = now().hour %}
      {% set month = now().month %}
      {% for record in records %}
        {% set time_dk = record.get('TimeDK', '') %}
        {% if time_dk[:10] == current_date and (time_dk[11:13] | int(-1)) == current_hour %}
          {% set spot = (record.get('DayAheadPriceDKK', 0) | float(0)) / 1000 %}
          {% set spot_vat = spot * 1.25 %}
          {% if current_hour < 6 %}
            {% set tariff = 0.0965 %}
          {% elif current_hour >= 17 and current_hour < 21 %}
            {% if month >= 4 and month <= 9 %}
              {% set tariff = 0.3763 %}
            {% else %}
              {% set tariff = 0.8683 %}
            {% endif %}
          {% else %}
            {% if month >= 4 and month <= 9 %}
              {% set tariff = 0.1448 %}
            {% else %}
              {% set tariff = 0.2894 %}
            {% endif %}
          {% endif %}
          {% set ns.total = (spot_vat + 0.04 + tariff) %}
        {% endif %}
      {% endfor %}
      {{ ns.total | round(3) if ns.total is not none else 'unknown' }}

  - name: "Deye Spot Price Sell Now"
    unique_id: deye_spot_price_sell_now
    unit_of_measurement: "kr/kWh"
    state_class: measurement
    state: >-
      {% set records = state_attr('sensor.deye_spot_price_cache', 'records') | default([], true) %}
      {% set ns = namespace(spot=none) %}
      {% set current_date = now().strftime('%Y-%m-%d') %}
      {% set current_hour = now().hour %}
      {% for record in records %}
        {% set time_dk = record.get('TimeDK', '') %}
        {% if time_dk[:10] == current_date and (time_dk[11:13] | int(-1)) == current_hour %}
          {% set ns.spot = ((record.get('DayAheadPriceDKK', 0) | float(0)) / 1000 * 1.25) %}
        {% endif %}
      {% endfor %}
      {{ ns.spot | round(3) if ns.spot is not none else 'unknown' }}

